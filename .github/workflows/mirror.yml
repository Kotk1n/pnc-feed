name: Miroir du flux PNC

on:
  schedule:
    # Toutes les heures. GitHub decale les crons planifies en periode de
    # charge, ce qui est sans importance pour un blog qui publie par mois.
    - cron: "17 * * * *"
  workflow_dispatch:

# Le job commite le flux regenere ; Pages redeploie ensuite tout seul.
permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerer le flux
        run: python3 normalize_feed.py

      - name: Commiter si le contenu a change
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain docs/pnc.rss)" ]; then
            message="Mise a jour du miroir du flux PNC"
          else
            # GitHub desactive les workflows planifies apres 60 jours sans
            # activite sur le depot. Comme on ne commite qu'a la parution d'un
            # billet, un blog silencieux deux mois suffirait a arreter le cron
            # -- et le miroir se figerait sans rien signaler. On force donc une
            # activite bien avant l'echeance.
            age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            echo "Flux inchange ; dernier commit il y a ${age_days} jour(s)."
            if [ "$age_days" -lt "$HEARTBEAT_AFTER_DAYS" ]; then
              echo "Rien a commiter."
              exit 0
            fi
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            message="Heartbeat : maintenir le workflow planifie actif"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pnc.rss .heartbeat
          git commit -m "$message"
          git push
          echo "Commite : $message"
        env:
          # Large marge sous la limite des 60 jours, pour absorber les reports
          # de cron que GitHub applique en periode de charge.
          HEARTBEAT_AFTER_DAYS: 50
